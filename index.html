<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>timeline-io</title>
  </head>
  <body>
    <div id="app">
      <section id="center">
        <div class="hero">
          <img src="main/hero.png" class="base" width="170" height="179">
          <img src="main/javascript.svg" class="framework" alt="JavaScript logo"/>
          <img src="main/vite.svg" class="vite" alt="Vite logo" />
        </div>
        <div>
          <h1>Get started</h1>
          <p>Edit <code>src/main.js</code> and save to test <code>HMR</code></p>
        </div>
        <button id="counter" type="button" class="counter"></button>
      </section>

      <div class="ticks"></div>

      <section id="next-steps">
        <div id="docs">
          <svg class="icon" role="presentation" aria-hidden="true"><use href="/icons.svg#documentation-icon"></use></svg>
          <h2>Sites</h2>
          <p>Poc websites</p>
          <ul>
            <li>
              <!-- target=_blank opens the site in a separate tab -->
              <a href="/nested/" target="_blank">
                <img class="logo" src="main/vite.svg" alt="" />
                Sample nested site
              </a>
            </li>

            <li>
              <a href="/timeline/" target="_blank">
                <img class="logo" src="main/vite.svg" alt="" />
                Timeline
              </a>
            </li>
           
          </ul>
        </div>
      </section>

      <div class="ticks"></div>
      <section id="spacer"></section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
